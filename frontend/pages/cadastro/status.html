<!-- ==================================================================
     Status — Cadastro (CMA / Linha 10)
     Página injetada pelo router dentro de <main id="content">.
     Sem <html>/<head>/<body>: tokens e componentes já vêm do shell.
==================================================================== -->

<style>
  /* ===== Cabeçalho de página ===== */
  .page-header {
    margin-bottom: 16px;
  }

  .page-header__eyebrow {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--cad);
    margin-bottom: 4px;
  }

  .page-header__title {
    font-size: 20px;
    font-weight: 700;
    color: var(--text-hi);
  }

  .page-header__desc {
    margin-top: 4px;
    font-size: 13px;
    color: var(--text-md);
  }

  .page-section {
    margin-bottom: 16px;
  }

  /* ===== Bloco 1 — Card de filtros ===== */
  .filters-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
  }

  .filter-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid var(--border);
  }

  /* ===== Bloco 2 — Card de resultados ===== */
  .results-count {
    font-size: 12px;
    color: var(--text-md);
    white-space: nowrap;
  }

  .table-wrap {
    overflow-x: auto;
  }

  .table-empty {
    padding: 40px 16px;
    text-align: center;
    color: var(--text-md);
    font-size: 13px;
  }

  .row-actions {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }

  /* ===== Amostra de cor (célula da tabela + detalhe) ===== */
  .color-chip {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--text-hi);
  }

  .color-chip__dot {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    border: 1px solid var(--border-hi);
    flex-shrink: 0;
  }

  /* ===== Toggle Ativo/Inativo ===== */
  .toggle {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
    user-select: none;
  }

  .toggle input {
    position: absolute;
    opacity: 0;
    width: 0;
    height: 0;
  }

  .toggle-track {
    width: 40px;
    height: 22px;
    flex-shrink: 0;
    background: var(--surface-3);
    border: 1px solid var(--border-hi);
    border-radius: 999px;
    position: relative;
    transition: background-color 0.15s ease, border-color 0.15s ease;
  }

  .toggle-track::after {
    content: '';
    position: absolute;
    top: 2px;
    left: 2px;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--text-md);
    transition: transform 0.15s ease, background-color 0.15s ease;
  }

  .toggle input:checked + .toggle-track {
    background: color-mix(in srgb, var(--ok) 30%, transparent);
    border-color: var(--ok);
  }

  .toggle input:checked + .toggle-track::after {
    transform: translateX(18px);
    background: var(--ok-hi);
  }

  .toggle-label {
    font-size: 13px;
    color: var(--text-hi);
  }

  /* ===== Campo de cor (color picker) ===== */
  .color-field {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .color-field input[type='color'] {
    width: 44px;
    height: 36px;
    padding: 2px;
    background: var(--surface-2);
    border: 1px solid var(--border-hi);
    border-radius: var(--radius-sm);
    cursor: pointer;
  }

  .color-field .input {
    flex: 1;
    font-family: var(--font-mono);
  }

  /* ===== Modais (<dialog> nativo) ===== */
  dialog.modal {
    border: none;
    padding: 0;
    width: 440px;
    max-width: 92vw;
    background: var(--surface-1);
    border-radius: var(--radius);
    color: var(--text-hi);
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
  }

  dialog.modal::backdrop {
    background: rgba(4, 4, 12, 0.7);
  }

  dialog.modal[open] {
    animation: modal-in 0.15s ease;
  }

  @keyframes modal-in {
    from {
      opacity: 0;
      transform: translateY(-8px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  .modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
  }

  .modal-title {
    font-size: 15px;
    font-weight: 700;
    color: var(--text-hi);
  }

  .modal-close {
    background: none;
    border: none;
    color: var(--text-md);
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
    padding: 4px;
  }

  .modal-close:hover {
    color: var(--text-hi);
  }

  .modal-body {
    padding: 18px;
    max-height: 65vh;
    overflow-y: auto;
  }

  .modal-footer {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    padding: 14px 18px;
    border-top: 1px solid var(--border);
  }

  .form-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 14px;
  }

  /* ===== Modal Detalhar — visualização somente leitura ===== */
  .detail-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }

  .detail-field__label {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--text-md);
    margin-bottom: 4px;
  }

  .detail-field__value {
    font-size: 14px;
    color: var(--text-hi);
    font-weight: 600;
  }

  /* ===== Modal de confirmação de exclusão ===== */
  dialog.modal-confirm {
    width: 380px;
  }

  .confirm-body {
    padding: 22px 18px;
    text-align: center;
  }

  .confirm-icon {
    width: 44px;
    height: 44px;
    margin: 0 auto 14px;
    border-radius: 50%;
    background: var(--crit-lo);
    border: 1px solid var(--crit);
    color: var(--crit-hi);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .confirm-text {
    font-size: 14px;
    font-weight: 600;
    color: var(--text-hi);
    margin-bottom: 4px;
  }

  .confirm-subtext {
    font-size: 12.5px;
    color: var(--text-md);
  }

  /* ===== Responsivo ===== */
  @media (max-width: 900px) {
    .filters-grid {
      grid-template-columns: repeat(2, 1fr);
    }
  }

  @media (max-width: 640px) {
    .filters-grid,
    .detail-grid {
      grid-template-columns: 1fr;
    }
  }
</style>

<!-- ===== Cabeçalho de página ===== -->
<div class="page-header">
  <div class="page-header__eyebrow">Cadastro</div>
  <h1 class="page-header__title">Status</h1>
  <p class="page-header__desc">Definição dos estados operacionais dos ativos</p>
</div>

<!-- ===== Bloco 1 — Filtros ===== -->
<div class="page-section card">
  <div class="card-header">
    <div class="card-title">Filtros</div>
  </div>
  <div class="card-body">
    <div class="filters-grid">
      <div>
        <label class="form-label" for="flt-id">ID</label>
        <input type="text" class="input" id="flt-id" placeholder="Ex.: 1" />
      </div>
      <div>
        <label class="form-label" for="flt-nome">Nome</label>
        <input type="text" class="input" id="flt-nome" placeholder="Buscar por nome..." />
      </div>
      <div>
        <label class="form-label" for="flt-status">Status</label>
        <select class="select" id="flt-status">
          <option value="">Todos</option>
          <option value="Ativo">Ativo</option>
          <option value="Inativo">Inativo</option>
        </select>
      </div>
    </div>
    <div class="filter-actions">
      <button type="button" class="btn btn-primary" id="btn-pesquisar">Pesquisar</button>
      <button type="button" class="btn btn-ghost" id="btn-limpar">Limpar</button>
    </div>
  </div>
</div>

<!-- ===== Bloco 2 — Resultados ===== -->
<div class="page-section card">
  <div class="card-header">
    <div>
      <div class="card-title">Resultados</div>
      <div class="card-subtitle" id="results-count">5 registros encontrados</div>
    </div>
    <button type="button" class="btn btn-primary btn-sm" id="btn-incluir">+ Incluir</button>
  </div>

  <div class="table-wrap">
    <table class="table" id="status-table">
      <thead>
        <tr>
          <th>ID</th>
          <th>Nome</th>
          <th>Cor</th>
          <th>Ativo</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody id="status-tbody">
        <!-- Linhas renderizadas via JS a partir do dataset mockado -->
      </tbody>
    </table>
    <div class="table-empty" id="table-empty" hidden>Nenhum status encontrado para os filtros aplicados.</div>
  </div>
</div>

<!-- ===== Modal Incluir / Alterar ===== -->
<dialog class="modal" id="modal-form">
  <div class="modal-header">
    <div class="modal-title" id="modal-form-title">Incluir Status</div>
    <button type="button" class="modal-close" data-close="modal-form" aria-label="Fechar">✕</button>
  </div>
  <div class="modal-body">
    <div class="form-grid">
      <div class="form-field">
        <label class="form-label" for="form-nome">Nome</label>
        <input type="text" class="input" id="form-nome" placeholder="Ex.: Online" />
      </div>
      <div class="form-field">
        <label class="form-label" for="form-cor">Cor</label>
        <div class="color-field">
          <input type="color" id="form-cor" value="#2FD4A0" />
          <input type="text" class="input" id="form-cor-hex" value="#2FD4A0" />
        </div>
      </div>
      <div class="form-field">
        <label class="form-label">Ativo</label>
        <label class="toggle">
          <input type="checkbox" id="form-ativo" checked />
          <span class="toggle-track"></span>
          <span class="toggle-label" id="form-ativo-label">Ativo</span>
        </label>
      </div>
    </div>
  </div>
  <div class="modal-footer">
    <button type="button" class="btn btn-ghost" data-close="modal-form">Cancelar</button>
    <button type="button" class="btn btn-primary" id="btn-salvar-form">Salvar</button>
  </div>
</dialog>

<!-- ===== Modal Detalhar ===== -->
<dialog class="modal" id="modal-detail">
  <div class="modal-header">
    <div class="modal-title">Detalhes do Status</div>
    <button type="button" class="modal-close" data-close="modal-detail" aria-label="Fechar">✕</button>
  </div>
  <div class="modal-body">
    <div class="detail-grid">
      <div>
        <div class="detail-field__label">ID</div>
        <div class="detail-field__value" id="det-id">—</div>
      </div>
      <div>
        <div class="detail-field__label">Ativo</div>
        <div class="detail-field__value" id="det-ativo">—</div>
      </div>
      <div>
        <div class="detail-field__label">Nome</div>
        <div class="detail-field__value" id="det-nome">—</div>
      </div>
      <div>
        <div class="detail-field__label">Cor</div>
        <div class="detail-field__value" id="det-cor">—</div>
      </div>
    </div>
  </div>
  <div class="modal-footer">
    <button type="button" class="btn btn-ghost" data-close="modal-detail">Fechar</button>
  </div>
</dialog>

<!-- ===== Modal de confirmação de exclusão ===== -->
<dialog class="modal modal-confirm" id="modal-confirm">
  <div class="confirm-body">
    <div class="confirm-icon">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M3 6h18"></path>
        <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
        <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path>
      </svg>
    </div>
    <div class="confirm-text">Confirmar exclusão?</div>
    <div class="confirm-subtext" id="confirm-subtext">Esta ação não poderá ser desfeita.</div>
  </div>
  <div class="modal-footer">
    <button type="button" class="btn btn-ghost" data-close="modal-confirm">Cancelar</button>
    <button type="button" class="btn btn-danger" id="btn-confirmar-exclusao">Confirmar</button>
  </div>
</dialog>

<!-- ===== JS específico desta página ===== -->
<script>
(function () {
  'use strict';

  /* ===== Dataset mockado dos status ===== */
  var STATUS_LIST = [
    { id: 1, nome: 'Online', cor: '#2FD4A0', ativo: true },
    { id: 2, nome: 'Alerta', cor: '#F0A830', ativo: true },
    { id: 3, nome: 'Crítico', cor: '#F05050', ativo: true },
    { id: 4, nome: 'Offline', cor: '#404468', ativo: true },
    { id: 5, nome: 'Parcial', cor: '#BFA0E8', ativo: true }
  ];

  var nextId = STATUS_LIST.length + 1;
  var state = { filtered: STATUS_LIST.slice() };
  var editingId = null;
  var deletingId = null;

  var tbody = document.getElementById('status-tbody');
  var emptyEl = document.getElementById('table-empty');
  var countEl = document.getElementById('results-count');

  function findById(id) {
    for (var i = 0; i < STATUS_LIST.length; i++) {
      if (STATUS_LIST[i].id === id) return STATUS_LIST[i];
    }
    return null;
  }

  function colorChip(cor) {
    return '<span class="color-chip"><span class="color-chip__dot" style="background:' + cor + '"></span>' + cor.toUpperCase() + '</span>';
  }

  function render() {
    tbody.innerHTML = state.filtered.map(function (s) {
      return '<tr>' +
        '<td class="td-mono">' + s.id + '</td>' +
        '<td class="hi">' + s.nome + '</td>' +
        '<td>' + colorChip(s.cor) + '</td>' +
        '<td>' + (s.ativo ? '<span class="badge-status status-ok"><span class="dot"></span>Sim</span>' : '<span class="badge-status status-offline"><span class="dot"></span>Não</span>') + '</td>' +
        '<td><div class="row-actions">' +
          '<button type="button" class="btn btn-ghost btn-sm" data-action="detalhar" data-id="' + s.id + '">Detalhar</button>' +
          '<button type="button" class="btn btn-ghost btn-sm" data-action="alterar" data-id="' + s.id + '">Alterar</button>' +
          '<button type="button" class="btn btn-danger btn-sm" data-action="excluir" data-id="' + s.id + '">Excluir</button>' +
        '</div></td>' +
        '</tr>';
    }).join('');

    emptyEl.hidden = state.filtered.length !== 0;
    tbody.parentElement.hidden = state.filtered.length === 0;
    countEl.textContent = state.filtered.length + (state.filtered.length === 1 ? ' registro encontrado' : ' registros encontrados');
  }

  /* ===== Filtros ===== */
  function applyFilters() {
    var id = document.getElementById('flt-id').value.trim();
    var nome = document.getElementById('flt-nome').value.trim().toLowerCase();
    var status = document.getElementById('flt-status').value;

    state.filtered = STATUS_LIST.filter(function (s) {
      if (id && String(s.id) !== id) return false;
      if (nome && s.nome.toLowerCase().indexOf(nome) === -1) return false;
      if (status === 'Ativo' && !s.ativo) return false;
      if (status === 'Inativo' && s.ativo) return false;
      return true;
    });
    render();
  }

  function clearFilters() {
    document.getElementById('flt-id').value = '';
    document.getElementById('flt-nome').value = '';
    document.getElementById('flt-status').value = '';
    state.filtered = STATUS_LIST.slice();
    render();
  }

  document.getElementById('btn-pesquisar').addEventListener('click', applyFilters);
  document.getElementById('btn-limpar').addEventListener('click', clearFilters);

  /* ===== Modal Incluir/Alterar ===== */
  var modalForm = document.getElementById('modal-form');
  var formAtivo = document.getElementById('form-ativo');
  var formAtivoLabel = document.getElementById('form-ativo-label');
  var formCor = document.getElementById('form-cor');
  var formCorHex = document.getElementById('form-cor-hex');

  formAtivo.addEventListener('change', function () {
    formAtivoLabel.textContent = formAtivo.checked ? 'Ativo' : 'Inativo';
  });

  formCor.addEventListener('input', function () {
    formCorHex.value = formCor.value.toUpperCase();
  });

  formCorHex.addEventListener('change', function () {
    var v = formCorHex.value.trim();
    if (/^#[0-9A-Fa-f]{6}$/.test(v)) formCor.value = v;
  });

  function openIncluir() {
    editingId = null;
    document.getElementById('modal-form-title').textContent = 'Incluir Status';
    document.getElementById('form-nome').value = '';
    formCor.value = '#2FD4A0';
    formCorHex.value = '#2FD4A0';
    formAtivo.checked = true;
    formAtivoLabel.textContent = 'Ativo';
    modalForm.showModal();
  }

  function openAlterar(id) {
    var s = findById(id);
    if (!s) return;
    editingId = id;
    document.getElementById('modal-form-title').textContent = 'Alterar Status';
    document.getElementById('form-nome').value = s.nome;
    formCor.value = s.cor;
    formCorHex.value = s.cor.toUpperCase();
    formAtivo.checked = s.ativo;
    formAtivoLabel.textContent = s.ativo ? 'Ativo' : 'Inativo';
    modalForm.showModal();
  }

  document.getElementById('btn-incluir').addEventListener('click', openIncluir);

  document.getElementById('btn-salvar-form').addEventListener('click', function () {
    var nome = document.getElementById('form-nome').value.trim();
    if (!nome) {
      alert('Preencha o Nome antes de salvar.');
      return;
    }
    var cor = formCorHex.value.trim() || formCor.value;
    var ativo = formAtivo.checked;

    if (editingId) {
      var s = findById(editingId);
      s.nome = nome;
      s.cor = cor;
      s.ativo = ativo;
    } else {
      STATUS_LIST.push({ id: nextId++, nome: nome, cor: cor, ativo: ativo });
    }
    modalForm.close();
    state.filtered = STATUS_LIST.slice();
    render();
  });

  /* ===== Modal Detalhar ===== */
  var modalDetail = document.getElementById('modal-detail');

  function openDetalhar(id) {
    var s = findById(id);
    if (!s) return;
    document.getElementById('det-id').textContent = s.id;
    document.getElementById('det-ativo').textContent = s.ativo ? 'Sim' : 'Não';
    document.getElementById('det-nome').textContent = s.nome;
    document.getElementById('det-cor').innerHTML = colorChip(s.cor);
    modalDetail.showModal();
  }

  /* ===== Modal de confirmação de exclusão ===== */
  var modalConfirm = document.getElementById('modal-confirm');

  function openExcluir(id) {
    var s = findById(id);
    if (!s) return;
    deletingId = id;
    document.getElementById('confirm-subtext').textContent = 'O status "' + s.nome + '" será removido permanentemente.';
    modalConfirm.showModal();
  }

  document.getElementById('btn-confirmar-exclusao').addEventListener('click', function () {
    if (deletingId == null) return;
    var idx = STATUS_LIST.findIndex(function (s) { return s.id === deletingId; });
    if (idx !== -1) STATUS_LIST.splice(idx, 1);
    deletingId = null;
    modalConfirm.close();
    state.filtered = STATUS_LIST.slice();
    render();
  });

  /* ===== Delegação de cliques nas ações da tabela ===== */
  tbody.addEventListener('click', function (evt) {
    var btn = evt.target.closest('[data-action]');
    if (!btn) return;
    var id = parseInt(btn.getAttribute('data-id'), 10);
    var action = btn.getAttribute('data-action');
    if (action === 'detalhar') openDetalhar(id);
    else if (action === 'alterar') openAlterar(id);
    else if (action === 'excluir') openExcluir(id);
  });

  /* ===== Fechamento de modais (botão ✕ / Cancelar) ===== */
  document.querySelectorAll('[data-close]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var dialog = document.getElementById(btn.getAttribute('data-close'));
      if (dialog) dialog.close();
    });
  });

  render();
})();
</script>
